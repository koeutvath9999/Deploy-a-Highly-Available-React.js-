defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend react_frontend
    bind *:80
    default_backend react_servers

backend react_servers
    balance roundrobin
    cookie SERVERID insert indirect nocache
    option httpchk GET /health.txt
    http-check expect status 200

    server web01 192.168.56.20:3000 check cookie web01
    server web02 192.168.56.21:3000 check cookie web02
